<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0c850"/>
      <stop offset="50%" style="stop-color:#e8ba30"/>
      <stop offset="100%" style="stop-color:#c9a028"/>
    </linearGradient>
    <linearGradient id="darkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2518"/>
      <stop offset="100%" style="stop-color:#1a170e"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#darkGradient)"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#goldGradient)" stroke-width="8"/>

  <!-- Stylized J with brush stroke effect -->
  <path d="M 280 120
           Q 285 120 290 125
           L 290 320
           Q 290 380 240 400
           Q 180 420 140 380
           Q 130 368 135 355
           Q 140 342 155 345
           Q 175 350 195 345
           Q 230 335 235 300
           L 235 180
           Q 235 165 250 165
           L 275 165
           Q 290 165 290 180
           L 290 125
           Q 285 120 280 120
           Z"
        fill="url(#goldGradient)"/>

  <!-- Paint brush accent stroke -->
  <path d="M 320 140
           Q 340 130 360 145
           Q 385 165 370 200
           Q 355 235 320 220
           Q 300 210 310 185
           Q 315 160 320 140
           Z"
        fill="url(#goldGradient)"
        opacity="0.85"/>

  <!-- Small paint drops -->
  <circle cx="380" cy="250" r="12" fill="#e8ba30" opacity="0.6"/>
  <circle cx="395" cy="290" r="8" fill="#e8ba30" opacity="0.4"/>
</svg>
